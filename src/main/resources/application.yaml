spring:
  application:
    name: ccp-assignment1-speech-to-text

  profiles:
    # Default the profile so the application is runnable with a bare 'mvnw spring-boot:run' and,
    # more importantly, so the packaged JAR still starts if it is launched with no environment
    # set. TITAN overrides this with SPRING_PROFILES_ACTIVE=titan; an environment variable beats a
    # value baked into the JAR, which is the whole reason this is safe to hardcode. Without a
    # default there would be no TranscriptionClient bean at all and startup would fail outright.
    default: local

  threads:
    virtual:
      # Serve every request on a virtual thread rather than a pooled platform thread.
      #
      # Each transcription request spends almost all of its life blocked on the external
      # speech-to-text call, doing no work. On platform threads that would cap us at Tomcat's
      # default pool size of 200, so the 201st concurrent request would queue and wait -- the
      # exact failure the assignment's concurrency requirement targets. Virtual threads unmount
      # while blocked, so a parked request costs memory but not a thread, and controllers can
      # stay in plain blocking style instead of going reactive.
      #
      # Requires Java 21+; this project targets Java 25 (see <java.version> in pom.xml).
      enabled: true

  lifecycle:
    # How long the shutdown sequence waits for in-flight requests before forcing beans to close.
    # Boot's default is 30s; a transcription of a sub-minute clip must display within 5s (see the
    # latency budget in CLAUDE.md), so anything still running after 10s is stuck, not slow.
    timeout-per-shutdown-phase: 10s

server:
  # Graceful, not immediate. On shutdown Tomcat stops accepting new connections and lets requests
  # already being served run to completion, up to the timeout above. Without this the connector is
  # torn down at once and every in-flight request is severed mid-response -- including, on a bad
  # day, the 202 acknowledging the shutdown itself.
  shutdown: graceful
