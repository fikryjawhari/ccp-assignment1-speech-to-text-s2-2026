spring:
  application:
    name: ccp-assignment1-speech-to-text

  threads:
    virtual:
      # Serve every request on a virtual thread rather than a pooled platform thread.
      #
      # Each transcription request spends almost all of its life blocked on the external
      # speech-to-text call, doing no work. On platform threads that would cap us at Tomcat's
      # default pool size of 200, so the 201st concurrent request would queue and wait -- the
      # exact failure the assignment's concurrency requirement targets. Virtual threads unmount
      # while blocked, so a parked request costs memory but not a thread, and controllers can
      # stay in plain blocking style instead of going reactive.
      #
      # Requires Java 21+; this project targets Java 25 (see <java.version> in pom.xml).
      enabled: true

  servlet:
    multipart:
      # Bound the upload at the edge, before our code runs.
      #
      # Boot's default is 1MB, which silently rejects a recording of roughly half a minute -- the
      # exact clip length the brief's latency budget describes, so the default is not merely
      # conservative here, it is wrong for this application. 25MB matches the ceiling the OpenAI
      # transcriptions API enforces, so anything this lets through is something the provider will
      # at least accept; a larger upload cannot succeed and there is no value in carrying it.
      #
      # Configured rather than checked in the controller on purpose. Tomcat enforces this while
      # parsing the multipart stream and rejects an oversize body before the handler method is
      # entered, so the payload is never fully buffered. An `if` in the controller could only fire
      # after the whole upload was already in memory -- it would reject the request without saving
      # any of the cost, and would hardcode an environment limit in Java where CLAUDE.md requires
      # configuration.
      max-file-size: 25MB
      # max-file-size caps one part; this caps the whole multipart body. Ours carries a single part,
      # so the two are effectively the same bound today -- set explicitly because leaving it at the
      # 10MB default would make the request-level limit, not the file-level one, the real ceiling.
      max-request-size: 25MB

  lifecycle:
    # How long the shutdown sequence waits for in-flight requests before forcing beans to close.
    # Boot's default is 30s; a transcription of a sub-minute clip must display within 5s (see the
    # latency budget in CLAUDE.md), so anything still running after 10s is stuck, not slow.
    timeout-per-shutdown-phase: 10s

server:
  # Graceful, not immediate. On shutdown Tomcat stops accepting new connections and lets requests
  # already being served run to completion, up to the timeout above. Without this the connector is
  # torn down at once and every in-flight request is severed mid-response -- including, on a bad
  # day, the 202 acknowledging the shutdown itself.
  shutdown: graceful

# Settings for the OpenAI transcriptions API, bound by OpenAiProperties.
#
# These live in the shared file rather than in a profile-specific one because there is no longer a
# profile that selects the real client. Which client runs is decided by whether api-key resolves to
# anything: OpenAiTranscriptionClient carries @ConditionalOnProperty on it, and
# StubTranscriptionClient fills in when that bean is absent.
#
# This replaced an application-titan.yaml selected by SPRING_PROFILES_ACTIVE=titan, on the
# assumption the marking platform set that variable. It does not -- its own log showed the
# application falling back to the "local" default and serving canned transcripts. Behaviour now
# depends only on whether a key was supplied, which is something the launching environment cannot
# get wrong by omission.
openai:
  # Deliberately no value: the key comes from the OPENAI_API_KEY environment variable through
  # Spring's relaxed binding (underscores to hyphens, case-insensitive). Writing it here would put
  # it in the JAR and in git history -- the exact failure the rubric names. With no key set, the
  # condition above fails, the stub takes over, and the application still runs offline.

  base-url: https://api.openai.com/v1/audio/transcriptions

  # Must be a token-billed model. whisper-1 reports usage as {type: "duration", seconds} with no
  # token counts at all, which cannot satisfy /api/v1/global/stats -- the contract asks for
  # inputTokens and outputTokens specifically. The gpt-4o-transcribe family reports
  # {type: "tokens", input_tokens, output_tokens}. See docs/plan.md "Model constraint".
  model: gpt-4o-mini-transcribe

  # The upstream half of the brief's five-second budget. Set longer than the budget rather than
  # shorter: a call that would have succeeded at six seconds is worth more than a strictly enforced
  # client-side deadline, since the user sees an error either way. It exists mainly so a hung
  # connection cannot hold a request thread indefinitely.
  request-timeout: 20s
