# Configuration active only when the "titan" profile is on.
#
# "titan" means: a real OPENAI_API_KEY is present in the environment and outbound network calls
# are expected. OpenAiTranscriptionClient carries @Profile("titan") and is therefore the only
# TranscriptionClient bean in the context, so every transcription goes to the real provider.
#
# TITAN activates this by setting SPRING_PROFILES_ACTIVE=titan in the process environment, which
# overrides the "local" default baked into application.yaml. The same command works on a
# development machine, which is how this profile is tested before upload.

openai:
  # NOTE: there is deliberately no api-key entry here.
  #
  # OpenAiProperties.apiKey binds from the environment variable OPENAI_API_KEY through Spring's
  # relaxed binding (underscores to hyphens, case-insensitive). Writing it in this file would put
  # the key in the JAR and in git history -- the exact failure the rubric names. Because there is
  # no default, a missing variable fails startup loudly instead of surfacing as a confusing 401 on
  # the first recording.

  base-url: https://api.openai.com/v1/audio/transcriptions

  # Must be a token-billed model. whisper-1 reports usage as {type: "duration", seconds} with no
  # token counts at all, which cannot satisfy /api/v1/global/stats -- the contract asks for
  # inputTokens and outputTokens specifically. The gpt-4o-transcribe family reports
  # {type: "tokens", input_tokens, output_tokens}, so the choice is made for us by the spec.
  # See docs/plan.md "Model constraint".
  #
  # The mini variant is roughly half the price and accurate enough for this workload; switching to
  # gpt-4o-transcribe is a one-line change here with no code impact, which is the point of binding
  # the model name as configuration rather than writing it into the client.
  model: gpt-4o-mini-transcribe

  # The brief's latency budget is 5 seconds from stopping the recording to displaying the
  # transcript, and this timeout is the upstream portion of that budget. Set longer than the
  # budget rather than shorter: a request that would have succeeded at 6 seconds is worth more
  # than a strictly-enforced client-side deadline, since the alternative is an error for the user
  # either way. It exists mainly so a hung connection cannot hold a request thread forever.
  request-timeout: 20s
