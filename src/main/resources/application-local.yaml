# Configuration active only when the "local" profile is on.
#
# Spring Boot layers this file over application.yaml when spring.profiles.active includes
# "local"; anything set here wins, anything absent falls through to the shared file. The point of
# the split is that no code and no shared config has to know which environment it is in -- the
# environment is selected once, at startup, from outside the JAR.
#
# "local" means: no OPENAI_API_KEY, no network. StubTranscriptionClient carries @Profile("local")
# and is therefore the only TranscriptionClient bean in the context, so the application runs
# end to end offline. Stage 4 adds application-titan.yaml and the real client alongside it.
